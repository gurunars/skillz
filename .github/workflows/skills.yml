name: skills

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check
      - run: make validate
        env:
          GH_TOKEN: ${{ github.token }}
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: skill-bundles
          path: dist/*.skill

  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make publish TAG=${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
