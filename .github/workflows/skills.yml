name: skills

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh skill publish --dry-run
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh skill publish --tag "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
