name: skills

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh skill publish --dry-run
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the version is the commit count
      - run: gh skill publish --tag "v0.0.$(git rev-list --count HEAD)"
        env:
          GH_TOKEN: ${{ github.token }}
